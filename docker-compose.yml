services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: departures
      POSTGRES_USER: departures
      POSTGRES_PASSWORD: departures
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U departures"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/departures
      DB_USER: departures
      DB_PASSWORD: departures
    ports:
      - "8080:8080"